<!--
      ABOUT:
        - Особенности реализации:
          1. Скопировать прошлый срез
          2. Многоуровневая сводная таблица
          3. Редактирование записей
          4. Мультивалютность и Единый баланс
          5. Курсы валют (Авто + Коррекция)
          6. Интеграция с Google Firebase
          7. Свайпы и Адаптивность
          8. Экспорт в CSV
          9. localStorage
          10. систему авторизации пользователей
          11. графическая шкала динамики (тренд изменения общего капитала по месяцам
          12. возможность создавать сразу несколько графиков разных типов


-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный Капитал PRO</title>
    <link rel="stylesheet" href="styles.css">
    <script src="chart.umd.js"></script> <!-- FROM:  https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js -->
    <!-- Firebase SDK Compat v9+ -->
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js"></script>
    <!-- <script src="https://gstatic.com"></script> -->
</head>
<body>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС ПРИЛОЖЕНИЯ -->
<div class="app-container">
    <header>
        <h1>Финансовый капитал</h1>
        <div class="header-right">
            <div id="sync-status" class="status-badge">Загрузка...</div>
            <button class="btn btn-danger btn-sm" id="logout-btn" style="padding: 4px 10px; font-size:12px;">Выйти</button>
        </div>
    </header>

    <nav class="tabs-nav">
        <button class="tab-btn active" data-tab="data-tab">📝 Срезы</button>
        <button class="tab-btn" data-tab="pivot-tab">📊 Аналитика</button>
        <button class="tab-btn" data-tab="settings-tab">⚙️ Настройки</button>
    </nav>

    <main class="swipe-zone" id="swipe-container">

        <!-- ВКЛАДКА 1: Срезы -->
        <section id="data-tab" class="tab-content active">
            <div class="card">
                <h3>Зафиксировать остаток</h3>
                <form id="asset-form">
                    <input type="hidden" id="edit-index">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Дата среза</label>
                            <input type="date" id="f-date" required>
                        </div>
                        <div class="form-group">
                            <label>Тип актива</label>
                            <select id="f-type" required></select>
                        </div>
                        <div class="form-group">
                            <label>Организация</label>
                            <select id="f-org" required></select>
                        </div>
                        <div class="form-group">
                            <label>Сумма остатка</label>
                            <input type="number" id="f-amount" step="any" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Валюта</label>
                            <select id="f-currency" required></select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Сохранить</button>
                        <button type="button" class="btn btn-secondary" id="clear-form-btn">Очистить</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="table-header-actions">
                    <h3>История остатков</h3>
                    <div class="actions-group">
                        <button class="btn btn-success" id="copy-slice-btn">📋 Копировать срез</button>
                        <button class="btn btn-secondary" id="export-csv-btn">📤 Экспорт CSV</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Дата</th>
                                <th>Тип актива</th>
                                <th>Организация</th>
                                <th>Сумма</th>
                                <th>Валюта</th>
                                <th>В базовой</th>
                                <th class="text-center">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="data-rows"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ВКЛАДКА 2: Аналитика (Сводные и Несколько графиков) -->
        <section id="pivot-tab" class="tab-content">
            <div class="analytics-layout">
                <div class="pivot-sidebar card">
                    <h4>Конструктор отчета</h4>
                    <div class="form-group">
                        <label>Строки (Уровень 1):</label>
                        <select id="pivot-row-1">
                            <option value="type">Тип актива</option>
                            <option value="org">Организация</option>
                            <option value="date">Дата</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Подстроки (Уровень 2):</label>
                        <select id="pivot-row-2">
                            <option value="none">-- Нет --</option>
                            <option value="type">Тип актива</option>
                            <option value="org">Организация</option>
                            <option value="currency">Валюта</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Фильтр по дате (для Сводной):</label>
                        <select id="pivot-filter-date"></select>
                    </div>

                    <h4 style="margin-top:20px; margin-bottom:10px;">Добавить график</h4>
                    <div class="form-group">
                        <label>Что анализируем:</label>
                        <select id="new-chart-source">
                            <option value="type">Структура по типам активов</option>
                            <option value="org">Структура по организациям</option>
                            <option value="trend">Исторический тренд (по месяцам)</option>
                        </select>
                    </div>
                    <!-- NEW: Time Period Selector for Charts -->
                    <div class="form-group">
                        <label>Период времени:</label>
                        <select id="new-chart-period">
                            <option value="ALL">За все время</option>
                            <option value="3">Последние 3 месяца</option>
                            <option value="6">Последние 6 месяцев</option>
                            <option value="12">Последний 1 год</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Вид виджета:</label>
                        <select id="new-chart-type">
                            <option value="bar">Столбчатая диаграмма</option>
                            <option value="pie">Круговая диаграмма</option>
                            <option value="line">Линейный график тренда</option>
                        </select>
                    </div>
                    <button class="btn btn-primary btn-sm w-100" id="add-chart-btn">➕ Добавить на панель</button>
                </div>

                <div class="analytics-main">
                    <div class="card">
                        <h4>Сводная таблица (в <span class="base-currency-label">RUB</span>)</h4>
                        <div class="table-wrapper">
                            <table id="pivot-table">
                                <thead>
                                    <tr id="pivot-headers"></tr>
                                </thead>
                                <tbody id="pivot-rows"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- СЕТКА ДИНАМИЧЕСКИХ ГРАФИКОВ -->
                    <div class="charts-dashboard-grid" id="charts-container">
                        <!-- Графики рендерятся скриптом динамически -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ВКЛАДКА 3: Настройки -->
        <section id="settings-tab" class="tab-content">
            <div class="settings-grid">
                <div class="card">
                    <h3>Справочники</h3>
                    <div class="form-group">
                        <label>Базовая валюта приложения:</label>
                        <select id="set-base-currency"></select>
                    </div>
                    <div class="form-group">
                        <label>Типы активов (через запятую):</label>
                        <textarea id="set-types" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Организации (через запятую):</label>
                        <textarea id="set-orgs" rows="3"></textarea>
                    </div>
                    <button class="btn btn-primary" id="save-directories-btn">Сохранить справочники</button>
                </div>

                <div class="card">
                    <h3>Курсы валют</h3>
                    <div class="rate-mode-selector">
                        <label class="switch-label">
                            <input type="checkbox" id="rate-auto-mode" checked> Авто-курс онлайн (-1%)
                        </label>
                    </div>
                    <div class="rate-mode-selector">
                        <label class="switch-label">
                            <input type="checkbox" id="rate-auto-mode" checked> Авто-курс онлайн (-1%)
                        </label>
                    </div>
                    <div id="manual-rates-container" class="manual-rates-list"></div>
                    <button class="btn btn-secondary" id="save-rates-btn" style="margin-top:15px; display:none;">Сохранить курсы</button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- ЭКРАН АВТОРИЗАЦИИ (Блокирует интерфейс до входа) -->
<div id="auth-screen" class="auth-overlay active">
    <div class="auth-card">
        <h2 id="auth-title">Вход в систему</h2>
        <form id="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="auth-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="auth-submit-btn">Войти</button>
        </form>
        <p class="auth-toggle">Впервые у нас? <span id="toggle-auth-mode">Зарегистрироваться</span></p>
        <div id="auth-error" class="error-text"></div>
    </div>
</div>

<!-- Подключаем скрипты -->
<script type="module" src="firebase-config.js" defer></script>
<script type="module" src="app.js" defer></script>
</body>
</html>
